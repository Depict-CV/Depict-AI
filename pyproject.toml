[project]
name = "Depict-AI"
version = "0.1.0"
description = '''
image data tool for computer vision from raw images to model training/fine-tuning.
tasks: data visualization, annotation, dataset management, cleaning.
cv tasks: classification, object detection, segmentation. images and videos.
'''
authors = [
    {name = "Edouard Geze",email = "edouard.geze@hotmail.fr"}
]
license = {text = "\"AGPL-3.0\""}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4,<3.0.0"
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-include-dir-to-nav>=1.0.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]
test = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.extend-select = ["I"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

site_name: Depict-AI Documentation
site_description: technical documentation for Depict-AI , Image data tool for computer vision
site_author: Edouard Geze, Tangi Migot
repo_url: https://github.com/Depict-CV/Depict-AI

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
  - Backend:
      - Overview: backend/overview.md
      - API Reference: backend/api.md
      - AI Inference: backend/AI_Inference_Guide.md
  - Frontend:
      - Overview: frontend/overview.md
      - Components: frontend/components.md
      - State Management: frontend/state.md
      - Routing: frontend/routing.md
      - Styling: frontend/styling.md
  - Architecture:
      - System Design: architecture/design.md
      - Database Schema: architecture/database.md
      - API Flow: architecture/api-flow.md
  - Deployment:
      - Docker Setup: deployment/docker.md
      - Production: deployment/production.md
  - Developers Guide:
      - Contributing: contributing.md
      - Code Style: code-style.md
      - Sentry Tutorial: sentry.md

theme:
  name: readthedocs
  language: en

plugins:
  - search
  - include-markdown:
      encoding: utf-8
      preserve_includer_indent: false
      dedent: false
      trailing_newlines: true
      comments: true
      rewrite_relative_urls: true
      heading_offset: 0
      recursive: true

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

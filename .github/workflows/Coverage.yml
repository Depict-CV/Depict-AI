name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[test]"
      - run: pytest tests --cov=src --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

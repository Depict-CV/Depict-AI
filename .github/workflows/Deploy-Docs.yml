name: Deploy Docs

on:
  push:
    branches:
      - main
      - eg/*
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install mkdocs mkdocs-material mkdocs-include-dir-to-nav mkdocs-include-markdown-plugin
      - run: mkdocs gh-deploy --force

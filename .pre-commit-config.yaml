repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: powershell.exe -Command "cd src/frontend; npm run format"
        language: system
        files: ^src/frontend/.*\.(js|ts|vue|json|css|md)$
        pass_filenames: false
